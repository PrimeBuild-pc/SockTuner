name: Dependabot auto-merge

# pull_request_target keeps write permissions for dependabot-triggered runs;
# safe here: the job never checks out or executes PR code. It is guarded on who
# opened the PR and where its branch lives, not on github.actor: a fork can make
# its own Dependabot push to a PR, which turns the actor into dependabot[bot].
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enable squash auto-merge once required checks pass
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
