name: Private pre-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic-version tag to publish (for example v0.2.0-alpha.1)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-release:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}

    steps:
      - name: Refuse release outside the private repository
        shell: pwsh
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:REPOSITORY_VISIBILITY -ne 'private') {
            throw "This workflow is restricted to private pre-releases."
          }
          if ($env:REPOSITORY -ne 'PrimeBuild-pc/SockTuner') {
            throw "Unexpected repository."
          }

      - name: Validate requested tag
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          $match = [regex]::Match($env:TAG_NAME, '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?\z')
          if (-not $match.Success) { throw "Tag is not a supported semantic version" }
          if ($match.Groups[4].Success) {
            foreach ($identifier in $match.Groups[4].Value.Split('.')) {
              if ($identifier -match '^[0-9]+$' -and $identifier.Length -gt 1 -and $identifier.StartsWith('0')) {
                throw "Numeric pre-release identifiers cannot contain leading zeroes"
              }
            }
          }
          "tag=$env:TAG_NAME" >> $env:GITHUB_OUTPUT
          "value=$($env:TAG_NAME.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Checkout requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Require tag commit to belong to main
        id: source
        shell: pwsh
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Failed to refresh origin/main" }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag is not on main" }
          "commit=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: tests/SockTuner.Tests/SockTuner.Tests.csproj

      - name: Restore
        run: |
          dotnet restore SockTuner.sln
          dotnet restore src/SockTuner/SockTuner.csproj -r win-x64

      - name: Build and test
        run: |
          dotnet build SockTuner.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet test SockTuner.sln -c Release --no-build

      - name: Publish self-contained x64 build
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet publish src/SockTuner/SockTuner.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:VERSION `
            -o artifacts/SockTuner

      - name: Upload unsigned build for release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-app
          path: artifacts/SockTuner/
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: build-release
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 15
    environment: private-release
    permissions:
      contents: write

    steps:
      - name: Revalidate repository and immutable release source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ needs.build-release.outputs.tag }}
          BUILT_COMMIT: ${{ needs.build-release.outputs.commit }}
        run: |
          $repository = gh api "repos/$env:REPOSITORY" | ConvertFrom-Json
          if ($repository.visibility -ne 'private' -or $repository.full_name -ne 'PrimeBuild-pc/SockTuner') {
            throw "This workflow is restricted to the private PrimeBuild-pc/SockTuner repository."
          }
          $liveCommit = (gh api "repos/$env:REPOSITORY/commits/$env:TAG_NAME" --jq '.sha').Trim()
          if ($liveCommit -ne $env:BUILT_COMMIT) {
            throw "Release tag moved after build; refusing to publish."
          }

      - name: Download unsigned build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-app
          path: artifacts/SockTuner

      - name: Sign executable when certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            "This is an unsigned private pre-release. Do not redistribute it." |
              Set-Content artifacts/SockTuner/UNSIGNED-PREVIEW.txt
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "SockTuner.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe not found" }

          & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD artifacts/SockTuner/SockTuner.exe
          if ($LASTEXITCODE -ne 0) { throw "Code signing failed" }
          Remove-Item $certificatePath -Force

      - name: Package and checksum
        id: package
        shell: pwsh
        env:
          VERSION: ${{ needs.build-release.outputs.version }}
        run: |
          $archive = "SockTuner-$env:VERSION-win-x64.zip"
          Compress-Archive -Path artifacts/SockTuner/* -DestinationPath "artifacts/$archive"
          $hash = (Get-FileHash "artifacts/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "artifacts/$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload final workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SockTuner-${{ needs.build-release.outputs.version }}-win-x64
          path: |
            artifacts/${{ steps.package.outputs.archive }}
            artifacts/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

      - name: Create GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.build-release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TITLE: SockTuner ${{ needs.build-release.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          BUILT_COMMIT: ${{ needs.build-release.outputs.commit }}
        run: |
          $liveCommit = (gh api "repos/$env:REPOSITORY/commits/$env:TAG_NAME" --jq '.sha').Trim()
          if ($liveCommit -ne $env:BUILT_COMMIT) { throw "Release tag moved after packaging." }
          gh release create "$env:TAG_NAME" `
            "artifacts/$env:ARCHIVE" `
            "artifacts/$env:ARCHIVE.sha256" `
            --repo "$env:REPOSITORY" `
            --title "$env:RELEASE_TITLE" `
            --generate-notes `
            --prerelease `
            --verify-tag
